name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest already ships the Android SDK. Do NOT add
      # android-actions/setup-android@v3: it tries to install the retired
      # legacy "tools" package and fails with "Failed to find package 'tools'".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build both APKs
        run: ./gradlew :app:assembleDebug :xposed:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: global-annotate-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            xposed/build/outputs/apk/debug/*.apk
          if-no-files-found: error
